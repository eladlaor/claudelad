[project]
name = "audio-transcribe"
version = "1.0.0"
description = "Local audio transcription with speaker diarization (faster-whisper + pyannote)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "pyannote.audio>=3.3.2",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "click>=8.0.0,<9.0.0",
    "rich>=13.0.0",
]

[project.scripts]
audio-transcribe = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
